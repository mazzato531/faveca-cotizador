<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAVECA - Cotizador de Precios</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f5f5f5; color: #333; }

        .header { background: linear-gradient(135deg, #1a472a 0%, #2d6b4f 100%); color: white; padding: 20px; text-align: center; }
        .header h1 { font-size: 28px; margin-bottom: 5px; }
        .header p { font-size: 14px; opacity: 0.9; }

        .container { max-width: 1200px; margin: 20px auto; padding: 0 20px; }

        .login-section { background: white; border-radius: 10px; padding: 40px; max-width: 400px; margin: 50px auto; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .login-section h2 { text-align: center; margin-bottom: 30px; color: #1a472a; }

        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: bold; color: #555; }
        .form-group input { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 8px; font-size: 16px; }
        .form-group input:focus { outline: none; border-color: #1a472a; }

        .btn { width: 100%; padding: 12px; background: #1a472a; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .btn:hover { background: #2d6b4f; }
        .btn-secondary { background: #666; margin-top: 10px; }
        .btn-secondary:hover { background: #555; }
        .btn-small { padding: 10px 20px; width: auto; }
        .btn-pdf { background: #1565C0; padding: 12px 25px; width: auto; }
        .btn-pdf:hover { background: #0d47a1; }
        .btn-clear { background: #e65100; padding: 12px 25px; width: auto; }
        .btn-clear:hover { background: #bf360c; }
        .btn-logout { background: #d32f2f; padding: 12px 25px; width: auto; }
        .btn-logout:hover { background: #b71c1c; }

        .error-message { color: #d32f2f; text-align: center; margin-top: 15px; font-size: 14px; }
        .hidden { display: none; }

        .admin-section { background: white; border-radius: 10px; padding: 30px; margin-bottom: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .admin-section h2 { color: #1a472a; margin-bottom: 20px; border-bottom: 3px solid #1a472a; padding-bottom: 10px; }

        .vendor-section { background: white; border-radius: 10px; padding: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .vendor-section h2 { color: #1a472a; margin-bottom: 20px; }

        .discounts-section { background: #f0f7f3; padding: 20px; border-radius: 8px; margin-bottom: 25px; border-left: 5px solid #1a472a; }
        .discounts-section h3 { color: #1a472a; margin-bottom: 15px; font-size: 16px; }
        .discount-options { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; }
        .discount-item { display: flex; align-items: center; background: white; padding: 15px; border-radius: 6px; border: 2px solid #ddd; }
        .discount-item input[type="checkbox"] { width: 20px; height: 20px; margin-right: 12px; cursor: pointer; }

        .products-table { width: 100%; border-collapse: collapse; margin-top: 20px; background: white; }
        .products-table thead { background: #1a472a; color: white; }
        .products-table th, .products-table td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #eee; }
        .product-name { font-weight: bold; color: #1a472a; }
        .price { font-weight: bold; font-size: 15px; color: #2d6b4f; }
        .line-header { background: #e8f5e9; font-weight: bold; color: #1a472a; }

        .qty-input { width: 65px; padding: 6px 8px; border: 2px solid #ddd; border-radius: 6px; text-align: center; }
        .qty-input:focus { outline: none; border-color: #1a472a; }

        .order-panel { background: #f0f7f3; border: 2px solid #1a472a; border-radius: 10px; padding: 25px; margin-top: 30px; }
        .order-panel h3 { color: #1a472a; margin-bottom: 20px; }

        .client-info { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .actions { text-align: center; margin-top: 25px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
        
        .order-table { width: 100%; border-collapse: collapse; background: white; }
        .order-table th { background: #1a472a; color: white; padding: 12px; }
        .order-table td { padding: 10px; border-bottom: 1px solid #ddd; }
        .grand-total td { background: #1a472a; color: white; font-weight: bold; }
        
        .badge { background: #1a472a; color: white; padding: 3px 10px; border-radius: 20px; font-size: 12px; display: inline-block; margin: 2px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>FAVECA</h1>
        <p>Sistema de Cotización de Precios</p>
    </div>

    <div class="container">
        <!-- Pantalla de Login -->
        <div id="loginSection" class="login-section">
            <h2>Acceso al Sistema</h2>
            <div class="form-group">
                <label>Contraseña de Administrador:</label>
                <input type="password" id="passwordInput" placeholder="Ingresa la contraseña">
            </div>
            <button class="btn" onclick="loginAdmin()">Ingresar como Administrador</button>
            <button class="btn btn-secondary" onclick="goToVendor()">Ir a Sección Vendedor</button>
            <div id="loginError" class="error-message hidden"></div>
        </div>

        <!-- Panel de Administrador -->
        <div id="adminSection" class="admin-section hidden">
            <h2>Panel de Administrador</h2>
            <div class="form-group">
                <label>Diferencial Cambiario:</label>
                <input type="number" id="differentialInput" step="0.01" value="1.40">
            </div>
            <button class="btn btn-small" onclick="saveDifferential()">Guardar</button>
            <button class="btn btn-logout" onclick="logoutAdmin()">Cerrar Sesión</button>
        </div>

        <!-- Panel de Vendedor -->
        <div id="vendorSection" class="vendor-section hidden">
            <h2>Cotizador de Precios</h2>
            
            <div class="discounts-section">
                <h3>Descuentos:</h3>
                <div class="discount-options">
                    <div class="discount-item">
                        <input type="checkbox" id="discount10" onchange="updatePrices()">
                        <label>Más de 10 unidades (-5%)</label>
                    </div>
                    <div class="discount-item">
                        <input type="checkbox" id="discount20" onchange="updatePrices()">
                        <label>Más de 20 unidades (-9.75%)</label>
                    </div>
                    <div class="discount-item">
                        <input type="checkbox" id="discountCash" onchange="updatePrices()">
                        <label>Pago de Contado (-5%)</label>
                    </div>
                </div>
            </div>

            <table class="products-table">
                <thead>
                    <tr>
                        <th>Producto</th>
                        <th>Precio BCV</th>
                        <th>Precio Especial</th>
                        <th>Cantidad</th>
                    </tr>
                </thead>
                <tbody id="productsTable"></tbody>
            </table>

            <div class="order-panel">
                <h3>Pedido / Cotización</h3>
                <div class="client-info">
                    <input type="text" id="clientName" placeholder="Cliente / Empresa">
                    <input type="text" id="clientRif" placeholder="RIF / Cédula">
                    <input type="text" id="clientPhone" placeholder="Teléfono">
                    <input type="text" id="sellerName" placeholder="Vendedor">
                </div>
                <div id="orderContent"></div>
            </div>

            <div class="actions">
                <button class="btn btn-pdf" onclick="generatePDF()">Descargar PDF</button>
                <button class="btn btn-clear" onclick="clearOrder()">Limpiar Pedido</button>
                <button class="btn btn-logout" onclick="logoutVendor()">Salir</button>
            </div>
        </div>
    </div>

    <script>
        const ADMIN_PASSWORD = "admin123";
        let currentDifferential = parseFloat(localStorage.getItem('differential')) || 1.40;

        const products = [
            { id: 1, line: "LINEA DE BOX", name: "BEDBOX 78x188", priceBCV: 102.00, priceSpecial: 73.00 },
            { id: 2, line: "LINEA DE BOX", name: "BEDBOX 98x188", priceBCV: 106.00, priceSpecial: 76.00 },
            { id: 3, line: "LINEA DE LITERAS", name: "SEVILLA 100-140x190", priceBCV: 295.00, priceSpecial: 211.00 },
            { id: 4, line: "LINEA DE CAMAS", name: "VICTORIA 80x190", priceBCV: 119.00, priceSpecial: 85.00 }
        ];

        function loginAdmin() {
            if (document.getElementById('passwordInput').value === ADMIN_PASSWORD) {
                document.getElementById('loginSection').classList.add('hidden');
                document.getElementById('adminSection').classList.remove('hidden');
            } else {
                document.getElementById('loginError').classList.remove('hidden');
            }
        }

        function goToVendor() {
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('vendorSection').classList.remove('hidden');
            renderProducts();
        }

        function logoutVendor() {
            document.getElementById('vendorSection').classList.add('hidden');
            document.getElementById('loginSection').classList.remove('hidden');
        }

        function logoutAdmin() {
            document.getElementById('adminSection').classList.add('hidden');
            document.getElementById('loginSection').classList.remove('hidden');
        }

        function saveDifferential() {
            currentDifferential = parseFloat(document.getElementById('differentialInput').value);
            localStorage.setItem('differential', currentDifferential);
            alert('Diferencial guardado');
        }

        function calculateFinalPrice(basePrice) {
            let price = basePrice;
            if (document.getElementById('discount20').checked) price = price * 0.9025;
            else if (document.getElementById('discount10').checked) price = price * 0.95;
            if (document.getElementById('discountCash').checked) price = price * 0.95;
            return Math.floor(price);
        }

        function renderProducts() {
            const tbody = document.getElementById('productsTable');
            tbody.innerHTML = '';
            let lastLine = '';
            
            products.forEach(p => {
                if (p.line !== lastLine) {
                    tbody.innerHTML += `<tr class="line-header"><td colspan="4">${p.line}</td></tr>`;
                    lastLine = p.line;
                }
                tbody.innerHTML += `
                    <tr>
                        <td>${p.name}</td>
                        <td>$${calculateFinalPrice(p.priceBCV)}</td>
                        <td>$${calculateFinalPrice(p.priceSpecial)}</td>
                        <td><input type="number" class="qty-input" id="qty_${p.id}" min="0" value="0" onchange="renderOrder()"></td>
                    </tr>
                `;
            });
            renderOrder();
        }

        function renderOrder() {
            let items = [];
            let total = 0;
            
            products.forEach(p => {
                let qty = parseInt(document.getElementById(`qty_${p.id}`)?.value || 0);
                if (qty > 0) {
                    let price = calculateFinalPrice(p.priceSpecial);
                    let subtotal = price * qty;
                    total += subtotal;
                    items.push(`<tr><td>${p.name}</td><td>${qty}</td><td>$${price}</td><td>$${subtotal}</td></tr>`);
                }
            });
            
            document.getElementById('orderContent').innerHTML = items.length ? `
                <table class="order-table">
                    <tr><th>Producto</th><th>Cant</th><th>Precio</th><th>Subtotal</th></tr>
                    ${items.join('')}
                    <tr class="grand-total"><td colspan="3"><strong>TOTAL</strong></td><td><strong>$${total}</strong></td></tr>
                </table>
            ` : '<p>Agrega cantidades para construir el pedido...</p>';
        }

        function clearOrder() {
            products.forEach(p => {
                let input = document.getElementById(`qty_${p.id}`);
                if (input) input.value = 0;
            });
            renderOrder();
        }

        function updatePrices() {
            renderProducts();
        }

        function generatePDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.text("FAVECA - Cotización", 20, 20);
            doc.text(`Fecha: ${new Date().toLocaleDateString()}`, 20, 30);
            doc.text(`Cliente: ${document.getElementById('clientName').value || 'N/A'}`, 20, 40);
            doc.save("cotizacion.pdf");
        }

        // Inicializar
        renderProducts();
    </script>
</body>
</html>
